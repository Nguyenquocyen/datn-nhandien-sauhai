{% extends "base.html" %}

{% block title %}Từ điển sâu bệnh - AgroScan AI{% endblock %}

{% block content %}
<section class="mx-auto max-w-7xl">
    <div class="mx-auto max-w-3xl text-center">
        <p class="text-xs font-bold uppercase tracking-[0.16em] text-primary">Dữ liệu từ cơ sở dữ liệu</p>
        <h1 class="mt-3 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Từ điển sâu bệnh lúa</h1>
        <p class="mt-3 text-sm leading-6 text-slate-500">Tra cứu thông tin loài sâu và các giải pháp IPM đã được lưu trong hệ thống.</p>
    </div>

    <div class="mx-auto mt-8 max-w-2xl">
        <label class="relative block">
            <span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-lg text-slate-400">search</span>
            <input id="dictionary-search" type="search" placeholder="Tìm theo tên sâu, tên khoa học hoặc mã YOLO..." class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-10 pr-4 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-emerald-100">
        </label>
    </div>

    <div id="dictionary-status" class="mt-8 rounded-2xl border border-slate-200 bg-white px-6 py-12 text-center text-sm text-slate-500">
        Đang tải dữ liệu từ điển...
    </div>
    <div id="dictionary-grid" class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
</section>

<div id="dictionary-detail-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 p-4" role="dialog" aria-modal="true" aria-labelledby="dictionary-detail-title">
    <div class="max-h-[calc(100vh-2rem)] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-6 shadow-2xl">
        <div class="flex items-start justify-between gap-4">
            <div>
                <p class="text-xs font-bold uppercase tracking-wide text-primary">Phác đồ IPM</p>
                <h2 id="dictionary-detail-title" class="mt-1 text-xl font-bold text-slate-900"></h2>
            </div>
            <button id="dictionary-detail-close" type="button" class="rounded-lg p-1 text-2xl leading-none text-slate-400 hover:bg-slate-100" aria-label="Đóng">&times;</button>
        </div>
        <div id="dictionary-detail-content" class="mt-5 space-y-4 text-sm leading-6 text-slate-600"></div>
    </div>
</div>
{% endblock %}
